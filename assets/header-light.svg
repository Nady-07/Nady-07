<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohamed Al Nady — Data &amp; Business Intelligence Analyst">
  <defs>
    <clipPath id="cardClipLight">
      <rect x="0.5" y="0.5" width="1199" height="239" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipLight)">
    <!-- Paper Base -->
    <rect width="1200" height="240" fill="#F4F4F4"/>

    <!-- Subtle Architectural Grid -->
    <g stroke="#0B0B0B" stroke-opacity="0.045" stroke-width="1">
      <line x1="120" y1="0" x2="120" y2="240"/>
      <line x1="240" y1="0" x2="240" y2="240"/>
      <line x1="360" y1="0" x2="360" y2="240"/>
      <line x1="480" y1="0" x2="480" y2="240"/>
      <line x1="600" y1="0" x2="600" y2="240"/>
      <line x1="720" y1="0" x2="720" y2="240"/>
      <line x1="840" y1="0" x2="840" y2="240"/>
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
    </g>

    <!-- Diagonal Editorial Split Plane (echoes portfolio hero) -->
    <polygon points="880,0 1200,0 1200,240 780,240" fill="#1D1D1D"/>
    <polygon points="866,0 880,0 780,240 766,240" fill="#D7D7D7"/>

    <!-- Minimal Data Bars Motif on Dark Right Plane -->
    <g fill="#F5F5F5" fill-opacity="0.16">
      <rect x="930" y="138" width="22" height="54"/>
      <rect x="964" y="114" width="22" height="78"/>
      <rect x="998" y="128" width="22" height="64"/>
      <rect x="1032" y="88" width="22" height="104"/>
      <rect x="1066" y="64" width="22" height="128" fill-opacity="0.34"/>
      <rect x="1100" y="96" width="22" height="96"/>
    </g>
    <line x1="922" y1="192" x2="1132" y2="192" stroke="#F5F5F5" stroke-opacity="0.35" stroke-width="1"/>
    <text x="1130" y="212" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2" fill="#B5B5B5">CAIRO · EGYPT</text>

    <!-- Architectural MN Monogram Tile -->
    <rect x="56" y="48" width="54" height="54" fill="#0B0B0B"/>
    <text x="83" y="82" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">MN</text>

    <!-- Editorial Kicker -->
    <text x="128" y="68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="3" fill="#555555">DATA &amp; BUSINESS INTELLIGENCE</text>

    <!-- Display Name -->
    <text x="128" y="102" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="1.2" fill="#0B0B0B">MOHAMED AL NADY</text>

    <!-- Hairline Rule -->
    <line x1="56" y1="126" x2="740" y2="126" stroke="#0B0B0B" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Role & Value Line -->
    <text x="56" y="158" font-family="'Open Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1D1D1D">Turning complex operational datasets into executive decisions.</text>

    <!-- Core Stack Line -->
    <text x="56" y="192" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.8" fill="#555555">SQL SERVER (T-SQL)  ·  POWER BI  ·  DAX  ·  STAR SCHEMA  ·  EXCEL</text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="6" stroke="#0B0B0B" stroke-opacity="0.16" stroke-width="1"/>
</svg>
